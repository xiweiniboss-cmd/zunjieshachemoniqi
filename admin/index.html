<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>刹车模拟器 · 后台管理</title>
<style>
:root{--orange:#ff976e;--paper:#f0f2e8;--bg:#101719}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--paper);font-family:'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;min-height:100svh;padding:20px 14px 60px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:20px;letter-spacing:1px;margin:10px 0 4px}
.sub{font-size:11px;color:#9aada3;letter-spacing:2px;margin-bottom:20px}
.card{background:linear-gradient(135deg,#19262a,#0f191d);border:1px solid #95b1a14a;border-radius:12px;padding:18px;margin-bottom:14px}
#login input{width:100%;background:#0d1518;border:1px solid #95b1a14a;border-radius:8px;color:var(--paper);font-size:15px;padding:12px;margin-bottom:12px;outline:none}
#login input:focus{border-color:var(--orange)}
button{background:var(--orange);color:#1b2526;border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px}
button.ghost{background:#232f33;color:var(--paper);border:1px solid #95b1a14a}
button.danger{background:#3a2028;color:#ff8ba0;border:1px solid #ff8ba055}
button:disabled{opacity:.5}
#msg{font-size:12px;color:#ff8ba0;margin-top:10px;min-height:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:linear-gradient(135deg,#19262a,#0f191d);border:1px solid #95b1a14a;border-radius:12px;padding:16px;text-align:center}
.stat b{display:block;font-size:30px;font-family:ui-monospace,Menlo,monospace;color:var(--orange)}
.stat span{font-size:11px;color:#9aada3;letter-spacing:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h2{font-size:14px;letter-spacing:2px;color:#9aada3;margin:18px 0 10px}
.run{background:#0d1518;border:1px solid #95b1a12e;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px;line-height:1.9}
.run .ip{font-family:ui-monospace,Menlo,monospace;color:#9fd8ff}
.run .ok{color:#b6f2d0;font-weight:700}
.run .no{color:#ff8ba0;font-weight:700}
.run .t{color:#9aada3;font-size:11px}
.empty{text-align:center;color:#9aada3;font-size:12px;padding:24px}
.delbtn{background:#3a2028;color:#ff8ba0;border:1px solid #ff8ba055;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;margin-left:6px}
.back{display:block;text-align:center;margin-top:20px;font-size:12px;color:#9aada3}
.back a{color:var(--orange)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏁 刹车模拟器 · 后台管理</h1>
  <p class="sub">BRAKE SIMULATOR / ADMIN</p>

  <div class="card" id="login">
    <input type="password" id="key" placeholder="请输入管理密码" autocomplete="off">
    <button id="go" style="width:100%">进入后台</button>
    <p id="msg"></p>
  </div>

  <div id="main" hidden>
    <div class="stats">
      <div class="stat"><b id="st-s">–</b><span>成功刹停</span></div>
      <div class="stat"><b id="st-f">–</b><span>刹车失败</span></div>
    </div>
    <div class="btns">
      <button class="ghost" id="refresh">🔄 刷新</button>
      <button class="danger" id="reset">🗑 一键清零</button>
      <button class="ghost" id="gofb">💬 查看反馈</button>
    </div>
    <h2>🎮 游戏记录（最新 200 条）</h2>
    <div id="runs"></div>
  </div>

  <p class="back"><a href="../">← 返回游戏</a></p>
</div>

<script>
var API = 'https://deepseekchatkele.pages.dev';
var K = '';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtT(t){var d=new Date(t);function p(x){return (x<10?'0':'')+x;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function msg(t){document.getElementById('msg').textContent=t||'';}
async function call(path, method){
  var r = await fetch(API+path+'?key='+encodeURIComponent(K),{method:method||'GET'});
  var j = await r.json().catch(function(){return {ok:false,error:'返回异常'};});
  if(r.status===403||j.error==='无权'){throw new Error('auth');}
  return j;
}
async function load(){
  msg('');
  var j = await call('/api/admin/brake/runs');
  if(!j.ok) throw new Error(j.error||'加载失败');
  document.getElementById('st-s').textContent=j.success;
  document.getElementById('st-f').textContent=j.fail;
  var h='';
  (j.runs||[]).forEach(function(x){
    h+='<div class="run"><span class="t">'+fmtT(x.t)+'</span> · <span class="ip">'+esc(x.ip||'--')+'</span><br>🚗 '+esc(x.n||'无名车手')+' · '+(x.ok?'<span class="ok">成功 '+(x.ms/1000).toFixed(3)+'s</span>':'<span class="no">失败</span>')+' · ⏱反应 '+((x.r||0)/1000).toFixed(3)+'s <button class="delbtn" data-d="'+esc(x.d||'')+'">删</button></div>';
  });
  document.getElementById('runs').innerHTML=h||'<div class="empty">暂无游戏记录</div>';
}
async function login(){
  K=document.getElementById('key').value.trim();
  if(!K){msg('请输入管理密码');return;}
  msg('验证中…');
  try{
    await load();
    try{localStorage.setItem('brake_admin_key',K);}catch(e){}
    document.getElementById('login').style.display='none';
    document.getElementById('main').hidden=false;
  }catch(e){
    msg(e.message==='auth'?'密码错误':'网络错误，请重试');
  }
}
document.getElementById('go').onclick=login;
document.getElementById('key').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
document.getElementById('runs').onclick=async function(e){
  var b=e.target.closest?e.target.closest('.delbtn'):null;
  if(!b)return;
  var d=b.getAttribute('data-d');
  if(!d||!confirm('删除该设备在排行榜和游戏记录中的所有数据？'))return;
  b.disabled=true;
  try{
    var r=await fetch(API+'/api/admin/brake/delete-entry?key='+encodeURIComponent(K),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:d})});
    var j=await r.json();
    if(j.ok)await load();else alert(j.error||'删除失败');
  }catch(err){alert('删除失败');}
  b.disabled=false;
};
document.getElementById('refresh').onclick=function(){load().catch(function(e){alert(e.message==='auth'?'密码已失效，请刷新页面重登':'加载失败');});};
document.getElementById('reset').onclick=async function(){
  if(!confirm('确定要一键清零吗？\n成功/失败计数、排行榜、游戏记录将全部清空，不可恢复！'))return;
  if(!confirm('再次确认：真的全部清空？'))return;
  this.disabled=true;
  try{
    var j=await call('/api/admin/brake/reset','POST');
    if(j.ok){alert('已清零，游戏首页和排行榜将同步显示为空');await load();}
    else alert(j.error||'清零失败');
  }catch(e){alert('操作失败');}
  this.disabled=false;
};
document.getElementById('gofb').onclick=function(){
  window.open(API+'/admin?key='+encodeURIComponent(K),'_blank');
};
/* 支持 ?key= 直达 + 记住密码 */
(function(){
  try{
    var m=/[?&]key=([^&]+)/.exec(location.search);
    var k=m?decodeURIComponent(m[1]):(localStorage.getItem('brake_admin_key')||'');
    if(k){document.getElementById('key').value=k;login();}
  }catch(e){}
})();
</script>
</body>
</html>
